# MkDocs Material Configuration
# Documentation: https://squidfunk.github.io/mkdocs-material/

site_name: Concept-RAG Documentation
site_description: Conceptual RAG with LanceDB, WordNet, and multi-signal hybrid search for MCP
site_author: Alex Komyagin
site_url: https://m2ux.github.io/concept-rag/

repo_name: m2ux/concept-rag
repo_url: https://github.com/m2ux/concept-rag

# Theme configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

# Navigation
nav:
  - Home: index.md

  - How It Works: how-it-works.md

  - Agent Guidance:
    - Overview: prompts/guidance.md
    - IDE Setup: prompts/ide-setup.md

  - Activities:
    - Overview: prompts/activities/index.md
    - Understand Topic: prompts/activities/understand-topic.md
    - Explore Concept: prompts/activities/explore-concept.md
    - Explore Category: prompts/activities/explore-category.md
    - Analyze Document: prompts/activities/analyze-document.md
    - Know My Library: prompts/activities/know-my-library.md
    - Identify Patterns: prompts/activities/identify-patterns.md
    - Identify Best Practices: prompts/activities/identify-best-practices.md
    - Curate Lexicon: prompts/activities/curate-lexicon.md

  - Skills:
    - Overview: prompts/skills/index.md
    - Deep Research: prompts/skills/deep-research.md
    - Concept Exploration: prompts/skills/concept-exploration.md
    - Category Exploration: prompts/skills/category-exploration.md
    - Document Analysis: prompts/skills/document-analysis.md
    - Library Discovery: prompts/skills/library-discovery.md
    - Pattern Research: prompts/skills/pattern-research.md
    - Practice Research: prompts/skills/practice-research.md

  - Getting Started:
    - Quick Start: getting-started.md
    - Troubleshooting: troubleshooting.md

  - API Reference: api-reference.md

  - Architecture:
    - Overview: architecture/README.md
    - Seeding Architecture: architecture/seeding-architecture.md
    - BM25 Keywords: architecture/bm25-keywords.md
    - WordNet Enrichment: architecture/wordnet-enrichment.md
    - Activity & Skill Interface: architecture/skills-interface.md
    - Database Schema: database-schema.md
    - Stage Cache: stage-cache-structure.md

  - FAQ: faq.md

# Engineering artifacts kept in the repo but excluded from the published site.
# ADRs are point-in-time decision records, not user documentation. development.md
# is the README-linked developer guide and uses repo-relative links that only
# resolve when browsed on GitHub, not on the rendered site.
exclude_docs: |
  architecture/adr*.md
  development.md

# Plugins
plugins:
  - search
